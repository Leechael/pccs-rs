# pccs-rs — Intel PCCS replacement
#
# Intel collateral requires an Intel PCS API key. AMD KDS caching does not.
# Every other setting has a built-in default; uncomment to override.
#
# TLS termination belongs on Caddy or nginx in front of this service.
# This package does not ship a reverse-proxy configuration.

# Required to fetch from Intel PCS (Ocp-Apim-Subscription-Key).
api_key = ""

# RocksDB directory. The systemd unit creates this via StateDirectory=.
db_path = "/var/lib/pccs-rs"

# host = "127.0.0.1"
