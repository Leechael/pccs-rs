[package]
name = "pccs-rs"
version = "0.2.0"
edition = "2021"
description = "Production Rust + Tokio replacement for Intel PCCS (RocksDB cache, 1:1 HTTP API)"
license = "BSD-3-Clause"
default-run = "pccs-rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "native-tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
subtle = "2"
bytes = "1"
thiserror = "2"
rocksdb = { version = "0.23", default-features = false, features = ["zstd", "bindgen-runtime"] }
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "pccs-rs"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
