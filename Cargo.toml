[package]
name = "pccs-rs"
version = "0.2.0"
edition = "2021"
description = "Production Rust + Tokio replacement for Intel PCCS (RocksDB cache, 1:1 HTTP API)"
license = "Apache-2.0"
default-run = "pccs-rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio", "server", "server-auto", "server-graceful", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "native-tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
subtle = "2"
bytes = "1"
thiserror = "2"
rocksdb = { version = "0.23", default-features = false, features = ["zstd", "bindgen-runtime"] }
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Socket options (TCP_NODELAY / SO_KEEPALIVE) on accepted and upstream sockets.
# Already in the tree as a hyper-util / tokio dependency.
socket2 = "0.6"
toml = "0.8"
toml_edit = "0.22"

[[bin]]
name = "pccs-rs"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
