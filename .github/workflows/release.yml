name: Release

# Manual bump + GHCR publish, modeled on
# https://github.com/Phala-Network/phala-cloud-gin-starter/.github/workflows/release.yml
# workflow_dispatch: pick patch/minor/major and an optional ref (default main).
# issue_comment: on an open same-repo PR, a repo owner/member/collaborator can
# comment `!release patch|minor|major` to tag that PR head and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      ref:
        description: git ref/branch/sha to release from (optional)
        required: false
        default: main
        type: string
  issue_comment:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      bump: ${{ steps.parse.outputs.bump }}
      target_sha: ${{ steps.parse.outputs.target_sha }}
      source: ${{ steps.parse.outputs.source }}
      repo_lower: ${{ steps.parse.outputs.repo_lower }}
    steps:
      - name: parse trigger
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName
            let shouldRelease = false
            let bump = ''
            let targetSha = ''
            let source = eventName

            if (eventName === 'workflow_dispatch') {
              shouldRelease = true
              bump = (context.payload.inputs?.bump || '').toLowerCase()
              targetSha = context.payload.inputs?.ref || context.ref.replace('refs/heads/', '')
            }

            if (eventName === 'issue_comment') {
              const body = (context.payload.comment?.body || '').trim()
              const match = body.match(/^!release\s+(patch|minor|major)$/i)
              const assoc = context.payload.comment?.author_association || 'NONE'
              const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR']
              const issue = context.payload.issue

              if (
                match &&
                issue?.pull_request &&
                issue.state === 'open' &&
                allowed.includes(assoc)
              ) {
                const prNumber = issue.number
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })
                const headRepo = pr.data.head.repo?.full_name || ''
                const baseRepo = `${context.repo.owner}/${context.repo.repo}`
                if (pr.data.state !== 'open') {
                  core.info(`skipping closed PR #${prNumber}`)
                } else if (headRepo.toLowerCase() !== baseRepo.toLowerCase()) {
                  core.info(`skipping fork PR #${prNumber} from ${headRepo}`)
                } else {
                  shouldRelease = true
                  bump = match[1].toLowerCase()
                  targetSha = pr.data.head.sha
                  source = `pr#${prNumber}`
                }
              }
            }

            core.setOutput('should_release', shouldRelease ? 'true' : 'false')
            core.setOutput('bump', bump)
            core.setOutput('target_sha', targetSha)
            core.setOutput('source', source)
            core.setOutput('repo_lower', `${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`)

  create-tag:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          # Tagging only runs trusted shell steps; write token is needed for git push.
          # Fork PR heads are rejected in prepare so untrusted remotes never reach here.
          persist-credentials: true

      - name: fetch tags
        run: git fetch --tags --force

      - name: compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi

          raw="${latest#v}"
          IFS='.' read -r major minor patch <<< "$raw"
          bump="${{ needs.prepare.outputs.bump }}"

          case "$bump" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            *)
              echo "invalid bump: $bump" >&2
              exit 1
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "tag already exists: $next" >&2
            exit 1
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest" >> "$GITHUB_OUTPUT"

      - name: generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          prev="${{ steps.version.outputs.previous_tag }}"
          if [ "$prev" = "v0.0.0" ] && [ -z "$(git tag -l 'v*')" ]; then
            log=$(git log --pretty=format:'- %s (%h)')
          else
            log=$(git log --pretty=format:'- %s (%h)' "${prev}"..HEAD)
          fi
          if [ -z "$log" ]; then
            log='- no user-facing changes'
          fi
          {
            echo 'changelog<<EOF'
            echo "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # The released binaries read their version from CARGO_PKG_VERSION, which
      # comes from Cargo.toml. Make the tagged commit carry the matching
      # version so image, .deb and local builds all agree.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: bump Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          semver="${version#v}"
          sed -i "s/^version = \".*\"/version = \"$semver\"/" Cargo.toml
          cargo update -p pccs-rs --offline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to $version"
          git push origin HEAD

      - name: create and push tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git tag -a "$version" -m "release $version"
          git push origin "$version"

  build:
    name: Build x86_64-linux
    needs: [prepare, create-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.create-tag.outputs.version }}
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-gnu-ubuntu-20.04-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary (glibc 2.31)
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            -v "$PWD":/src \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -w /src \
            -e CARGO_TERM_COLOR=always \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config \
                clang libclang-dev llvm-dev zlib1g-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal
              . "$HOME/.cargo/env"
              cargo build --release --locked --bin pccs-rs --target x86_64-unknown-linux-gnu
            '
      - name: Package tarball and deb
        run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf dist/pccs-rs-x86_64-unknown-linux-gnu.tar.gz pccs-rs
          (cd dist && sha256sum pccs-rs-x86_64-unknown-linux-gnu.tar.gz > pccs-rs-x86_64-unknown-linux-gnu.tar.gz.sha256)
          VERSION="${{ needs.create-tag.outputs.version }}"
          VERSION="${VERSION#v}"
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh \
            --version "$VERSION" \
            --binary target/x86_64-unknown-linux-gnu/release/pccs-rs \
            --output dist
          (cd dist && sha256sum "pccs-rs_${VERSION}_amd64.deb" > "pccs-rs_${VERSION}_amd64.deb.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ needs.create-tag.outputs.changelog }}
          VERSION: ${{ needs.create-tag.outputs.version }}
          REPO_LOWER: ${{ needs.prepare.outputs.repo_lower }}
        run: |
          set -euo pipefail
          image_tag="${VERSION#v}"
          {
            echo "## changelog"
            echo
            printf '%s\n' "$CHANGELOG"
            echo
            echo "## docker image"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LOWER}:${image_tag}"
            echo "docker pull ghcr.io/${REPO_LOWER}:latest"
            echo '```'
          } > /tmp/release-notes.md
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md

  docker:
    name: Publish GHCR image
    needs: [prepare, create-tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.create-tag.outputs.version }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.create-tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.create-tag.outputs.version }}
      # The base images are pulled anonymously from mirror.gcr.io; a registry
      # can still return 429. Retry the build twice with backoff; the last
      # attempt fails the job.
      - uses: docker/build-push-action@v7
        id: build1
        continue-on-error: true
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Wait before retry
        if: steps.build1.outcome == 'failure'
        run: sleep 60
      - uses: docker/build-push-action@v7
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Wait before retry
        if: steps.build2.outcome == 'failure'
        run: sleep 180
      - uses: docker/build-push-action@v7
        id: build3
        if: steps.build2.outcome == 'failure'
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
