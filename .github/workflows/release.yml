name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin pccs-rs --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-gnu/release -czf dist/pccs-rs-x86_64-unknown-linux-gnu.tar.gz pccs-rs
          sha256sum dist/pccs-rs-x86_64-unknown-linux-gnu.tar.gz > dist/pccs-rs-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
