name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  prek:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt check
        run: cargo fmt --check --all
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  version-check:
    name: Cargo.toml version is not behind latest tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Cargo.toml >= latest v* tag
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          current=$(grep '^version =' Cargo.toml | head -n1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "latest tag:    ${latest:-<none>}"
          echo "Cargo.toml:    $current"
          if [ -z "$latest" ]; then
            echo "no existing v* tags; skipping comparison"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$latest" "$current" | sort -V | head -n1)" != "$latest" ]; then
            echo "ERROR: Cargo.toml version $current is behind latest tag v$latest" >&2
            exit 1
          fi

  # linux/arm64 runs natively on GitHub's arm runners (no emulation).
  test-arm64:
    name: cargo test (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  docker-arm64:
    name: docker build (linux/arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: pccs-rs:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Run image --version
        run: |
          set -euo pipefail
          expected=$(grep '^version =' Cargo.toml | head -n1 | sed 's/.*"\([^"]*\)".*/\1/')
          test "$(docker image inspect pccs-rs:ci-arm64 --format '{{.Architecture}}')" = arm64
          actual=$(docker run --rm --platform linux/arm64 pccs-rs:ci-arm64 --version)
          echo "expected=pccs-rs $expected actual=$actual"
          test "$actual" = "pccs-rs $expected"

  deb-arm64:
    name: arm64 .deb packaging
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin pccs-rs
      - name: Package arm64 deb
        run: |
          set -euo pipefail
          version=$(grep '^version =' Cargo.toml | head -n1 | sed 's/.*"\([^"]*\)".*/\1/')
          ./packaging/build-deb.sh \
            --version "$version" \
            --arch arm64 \
            --binary target/release/pccs-rs \
            --output dist
      - name: Verify deb metadata and packaged binary
        run: |
          set -euo pipefail
          expected=$(grep '^version =' Cargo.toml | head -n1 | sed 's/.*"\([^"]*\)".*/\1/')
          deb="dist/pccs-rs_${expected}_arm64.deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$expected"
          test "$(dpkg-deb --field "$deb" Architecture)" = arm64
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "$deb" "$extracted"
          file "$extracted/usr/bin/pccs-rs" | grep -q 'ARM aarch64'
          actual=$("$extracted/usr/bin/pccs-rs" --version)
          echo "expected=pccs-rs $expected actual=$actual"
          test "$actual" = "pccs-rs $expected"

  release-image-refs:
    name: release image refs are lowercase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reject github.repository in image refs
        run: |
          set -euo pipefail
          if grep -nE '(name=|IMAGE:).*github\.repository' .github/workflows/release.yml; then
            echo "ERROR: image refs must use needs.prepare.outputs.repo_lower (github.repository may contain uppercase)" >&2
            exit 1
          fi
