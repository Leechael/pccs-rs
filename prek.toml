# See https://prek.j178.dev/configuration/

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false
